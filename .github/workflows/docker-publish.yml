# Builds and publishes multi-architecture images (linux/amd64 + linux/arm64)
# of this fork to GitHub Container Registry, so the app can be pulled and
# hosted for real-world testing:
#
#   ghcr.io/driftywinds/tasktrove:edge          <- latest main build
#   ghcr.io/driftywinds/tasktrove:sha-<short>   <- immutable per-commit build
#
# Host it with the staging stack: selfhost/docker-compose.staging.yml
#
# Runs on every push to main and on manual dispatch (optionally adding an
# extra tag, e.g. `test` or a release version).

name: Docker Publish (multi-arch)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (optional, e.g. test or v0.12.4-pro.1)"
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR requires lowercase image names; github.repository preserves the
      # repo's capitalization (driftywinds/TaskTrove).
      - name: Set lowercase image name
        id: image
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Emulates the arm64 steps of the build (the Dockerfile's builder stages
      # are pinned to $BUILDPLATFORM, so the Next.js build itself runs natively
      # — QEMU only serves the thin runner stage. This matches how the upstream
      # image was published).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
